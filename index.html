<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3a66">
  <meta name="description" content="PPM Integrated Maintenance">
  <title>PPM Integrated Maintenance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef3f8;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 56px;
      background: linear-gradient(135deg, #06345c, #0d5c91);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: rgba(255,255,255,.15);
      display: grid;
      place-items: center;
      font-size: 20px;
      flex: 0 0 auto;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      font-size: 11px;
      opacity: .82;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex: 0 0 auto;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
      background: rgba(255,255,255,.14);
      color: white;
    }

    button:hover {
      background: rgba(255,255,255,.23);
    }

    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #f5f8fb;
      color: #234;
      z-index: 2;
      transition: opacity .25s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-box {
      text-align: center;
      padding: 25px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 12px;
      border: 4px solid #d8e2ec;
      border-top-color: #0d5c91;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .topbar {
        min-height: 50px;
        padding: 6px 9px;
      }

      .brand-icon {
        width: 34px;
        height: 34px;
      }

      .brand-title {
        font-size: 13px;
      }

      .brand-subtitle {
        font-size: 10px;
      }

      button {
        padding: 8px 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">⚙️</div>
        <div class="brand-text">
          <div class="brand-title">PPM Integrated Maintenance</div>
          <div class="brand-subtitle">Lembaga Alkitab Indonesia • PPM</div>
        </div>
      </div>

      <div class="actions">
        <button type="button" onclick="reloadApp()" title="Muat ulang aplikasi">
          ↻ Refresh
        </button>
        <button type="button" onclick="openApp()" title="Buka aplikasi langsung">
          ↗ Buka
        </button>
      </div>
    </header>

    <main class="frame-wrap">
      <div id="loading" class="loading">
        <div class="loader-box">
          <div class="spinner"></div>
          <div>Memuat PPM Integrated Maintenance...</div>
        </div>
      </div>

      <iframe
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbytcGdfInB27Kx6vS48Ow4hdPW-zwxGUxOyk117oWjvafcHIh7dOiRIVV8TgeisNPfV/exec"
        title="PPM Integrated Maintenance"
        allow="fullscreen"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </main>

  </div>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbytcGdfInB27Kx6vS48Ow4hdPW-zwxGUxOyk117oWjvafcHIh7dOiRIVV8TgeisNPfV/exec';
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", function() {
      loading.classList.add("hidden");
    });

    function reloadApp() {
      loading.classList.remove("hidden");
      frame.src = APP_URL + (APP_URL.includes("?") ? "&" : "?") + "_t=" + Date.now();
    }

    function openApp() {
      window.open(APP_URL, "_blank", "noopener,noreferrer");
    }
  </script>
</body>
</html>
